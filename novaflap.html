<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Flap</title>
<style>
  :root {
    --bg: #12141b;
    --panel: #191c24;
    --line: #2b303d;
    --text: #eceff4;
    --muted: #8b93a5;
    --accent: #ffd166;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
  }

  #stage { position: fixed; inset: 0; display: block; cursor: pointer; }

  .backlink {
    position: fixed; top: 16px; left: 18px; z-index: 20;
    color: var(--muted); text-decoration: none;
    font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase;
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 7px;
    background: rgba(14,16,21,.6);
    transition: color .16s, border-color .16s;
  }
  .backlink:hover { color: var(--accent); border-color: var(--accent); }

  .score {
    position: fixed; top: 26px; left: 0; right: 0; z-index: 15;
    text-align: center; pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .score .num { font-size: 52px; font-weight: 700; text-shadow: 0 2px 14px rgba(0,0,0,.45); }

  .overlay {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,11,15,.72);
    text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay h1 {
    margin: 0 0 6px; font-size: 26px; letter-spacing: .18em; text-transform: uppercase;
    color: #f2f4f8;
  }
  .overlay .sub { margin: 0 0 20px; font-size: 12.5px; color: var(--muted); letter-spacing: .04em; }
  .overlay .go {
    font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent);
    border: 1px solid rgba(255,209,102,.5); border-radius: 9px; padding: 12px 30px;
    background: linear-gradient(180deg, rgba(255,209,102,.18), rgba(255,209,102,.08));
    margin-bottom: 22px;
  }
  .board {
    width: min(280px, 80vw);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px;
  }
  .board h3 {
    margin: 0 0 10px; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 500;
  }
  .row {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 5px 0; font-size: 12.5px; border-bottom: 1px solid rgba(255,255,255,.04);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .row:last-child { border-bottom: none; }
  .row .rank { color: var(--muted); width: 20px; text-align: left; }
  .row .name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { margin-top: 12px; font-size: 10.5px; color: var(--muted); max-width: 280px; }
</style>
</head>
<body>

<a class="backlink" href="index.html">← Library</a>

<canvas id="stage"></canvas>

<div class="score"><div class="num" id="scorenum">0</div></div>

<div class="overlay" id="start">
  <h1>Nova Flap</h1>
  <div class="sub">Click, tap, or press space to flap. Thread the gaps.</div>
  <button class="go" id="gobtn">Press to Start</button>
</div>

<div class="overlay" id="gameover" hidden>
  <h1>Crashed</h1>
  <div class="sub" id="finalscore">Score 0</div>
  <button class="go" id="retrybtn">Try Again</button>
  <div class="board">
    <h3 id="boardlabel">Leaderboard</h3>
    <div id="boardrows"></div>
  </div>
  <div class="note" id="signinnote"></div>
</div>

<script src="nova.js"></script>
<script>
(function () {
  'use strict';

  var GAME_ID = 'novaflap';
  var BEST_KEY = 'nova.novaflap.best';

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var WIDTH = 0, HEIGHT = 0, DPR = 1;

  var GRAVITY, FLAP_VY, BIRD_R, PIPE_W, GAP, PIPE_SPACING, SCROLL_SPEED;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    WIDTH = window.innerWidth;
    HEIGHT = window.innerHeight;
    canvas.width = Math.floor(WIDTH * DPR);
    canvas.height = Math.floor(HEIGHT * DPR);
    canvas.style.width = WIDTH + 'px';
    canvas.style.height = HEIGHT + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    GRAVITY = HEIGHT * 2.2;
    FLAP_VY = -HEIGHT * 0.62;
    BIRD_R = Math.max(10, HEIGHT * 0.018);
    PIPE_W = Math.max(50, WIDTH * 0.09);
    GAP = Math.max(150, HEIGHT * 0.26);
    PIPE_SPACING = Math.max(220, WIDTH * 0.42);
    SCROLL_SPEED = Math.max(180, WIDTH * 0.26);
  }
  window.addEventListener('resize', resize);
  resize();

  function $(id) { return document.getElementById(id); }

  function loadBest() {
    try { var v = localStorage.getItem(BEST_KEY); return v ? parseInt(v, 10) : 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
  }
  var best = loadBest();

  // ================================================================== state

  var birdX, birdY, birdVY, pipes, score, running, over, spawnTimer;

  function resetGame() {
    birdX = WIDTH * 0.28;
    birdY = HEIGHT * 0.42;
    birdVY = 0;
    pipes = [];
    score = 0;
    over = false;
    spawnTimer = 0;
    $('scorenum').textContent = '0';
    spawnPipe(WIDTH + 60);
  }

  function spawnPipe(x) {
    var margin = HEIGHT * 0.12;
    var gapTop = margin + Math.random() * Math.max(10, (HEIGHT - GAP - margin * 2));
    pipes.push({ x: x, gapTop: gapTop, scored: false });
  }

  resize();
  resetGame();
  running = false;

  // =============================================================== physics

  function update(dt) {
    if (!running || over) return;

    birdVY += GRAVITY * dt;
    birdY += birdVY * dt;

    spawnTimer += SCROLL_SPEED * dt;
    if (spawnTimer >= PIPE_SPACING) {
      spawnTimer = 0;
      spawnPipe(WIDTH + PIPE_W);
    }

    for (var i = pipes.length - 1; i >= 0; i--) {
      var p = pipes[i];
      p.x -= SCROLL_SPEED * dt;

      if (!p.scored && p.x + PIPE_W < birdX - BIRD_R) {
        p.scored = true;
        score++;
        $('scorenum').textContent = String(score);
      }

      if (p.x + PIPE_W < -10) pipes.splice(i, 1);
    }

    // collision: ceiling, ground, or a pipe body outside the gap
    if (birdY - BIRD_R < 0 || birdY + BIRD_R > HEIGHT) {
      endGame();
      return;
    }
    for (var j = 0; j < pipes.length; j++) {
      var pp = pipes[j];
      if (birdX + BIRD_R > pp.x && birdX - BIRD_R < pp.x + PIPE_W) {
        if (birdY - BIRD_R < pp.gapTop || birdY + BIRD_R > pp.gapTop + GAP) {
          endGame();
          return;
        }
      }
    }
  }

  function flap() {
    if (!running) { startGame(); return; }
    if (over) return;
    birdVY = FLAP_VY;
  }

  // ================================================================ render

  function render() {
    var grd = ctx.createLinearGradient(0, 0, 0, HEIGHT);
    grd.addColorStop(0, '#2a3a55');
    grd.addColorStop(1, '#141a26');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.fillStyle = '#4a9d8f';
    for (var i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      ctx.fillRect(p.x, 0, PIPE_W, p.gapTop);
      ctx.fillRect(p.x, p.gapTop + GAP, PIPE_W, HEIGHT - (p.gapTop + GAP));
    }

    ctx.save();
    ctx.translate(birdX, birdY);
    var tilt = Math.max(-0.6, Math.min(0.9, birdVY / (HEIGHT * 0.9)));
    ctx.rotate(tilt);
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1c22';
    ctx.beginPath();
    ctx.arc(BIRD_R * 0.35, -BIRD_R * 0.25, BIRD_R * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ================================================================== loop

  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // =============================================================== flow

  function startGame() {
    $('start').hidden = true;
    $('gameover').hidden = true;
    resetGame();
    running = true;
  }

  function endGame() {
    over = true;
    running = false;
    if (score > best) { best = score; saveBest(best); }
    $('finalscore').textContent = 'Score ' + score + (best > 0 ? ' · Best ' + best : '');
    setTimeout(function () { $('gameover').hidden = false; }, 350);
    postScore();
  }

  canvas.addEventListener('pointerdown', function () { flap(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); flap(); }
    if (e.key.toLowerCase() === 'r' && over) startGame();
  });
  $('gobtn').addEventListener('click', startGame);
  $('retrybtn').addEventListener('click', startGame);

  // ------------------------------------------------------------- leaderboard

  function refreshBoard() {
    var rowsEl = $('boardrows');
    rowsEl.innerHTML = '<div class="row"><span class="name">Loading…</span></div>';
    if (!window.Nova) { rowsEl.innerHTML = ''; return; }
    window.Nova.topScores(GAME_ID, 5, false).then(function (res) {
      $('boardlabel').textContent = res.global ? 'Leaderboard · World' : 'Leaderboard · This device';
      rowsEl.innerHTML = '';
      if (!res.rows.length) {
        rowsEl.innerHTML = '<div class="row"><span class="name">No runs yet — be the first.</span></div>';
        return;
      }
      res.rows.forEach(function (row, i) {
        var r = document.createElement('div');
        r.className = 'row';
        r.innerHTML = '<span class="rank">#' + (i + 1) + '</span><span class="name"></span><span></span>';
        r.querySelector('.name').textContent = row.name;
        r.lastElementChild.textContent = row.score;
        rowsEl.appendChild(r);
      });
    });
  }

  function postScore() {
    if (score <= 0) { refreshBoard(); return; }
    var user = window.Nova && window.Nova.user();
    $('signinnote').textContent = user ? '' : 'Sign in from the library to be ranked.';
    if (!window.Nova) return;
    window.Nova.submitScore(GAME_ID, score, {}, false).then(refreshBoard);
  }

  refreshBoard();
  if (window.Nova) window.Nova.restore().then(refreshBoard).catch(function () {});

  var backlink = document.querySelector('.backlink');
  if (backlink && window.opener) {
    backlink.addEventListener('click', function (e) {
      e.preventDefault();
      window.close();
    });
  }
})();
</script>
</body>
</html>
