<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  :root {
    --bg: #0a0c12;
    --panel: #141822;
    --panel-2: #1c2130;
    --line: #262d3d;
    --text: #e8ecf5;
    --muted: #7d879c;
    --accent: #f0b429;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(900px 600px at 50% -10%, #241f16 0%, transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
  }

  .game { display: flex; gap: 22px; align-items: flex-start; }

  /* ---------------------------------------------------------------- board */

  .board-wrap {
    position: relative;
    border-radius: 12px; padding: 10px;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }

  #board {
    position: relative;
    width: 420px; height: 420px;
  }

  .cell, .tile {
    position: absolute;
    width: 96px; height: 96px;
    border-radius: 8px;
  }
  .cell { background: rgba(255,255,255,.035); }

  .tile {
    display: grid; place-items: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 700; font-size: 34px;
    color: #1a1206;
    background: #d8cfc0;
    transition: transform .11s ease-out;
    will-change: transform;
  }
  .tile.spawn { animation: pop .14s ease-out; }
  .tile.merged { animation: bump .14s ease-out; }
  @keyframes pop  { from { transform: scale(.3); } }
  @keyframes bump { 50% { scale: 1.12; } }

  /* The classic ramp, pulled toward this palette: pale sand at the bottom,
     hot amber through the middle, and cool blue past 1024 so the big tiles
     read as clearly different rather than just "more orange". */
  .v2    { background: #e8e0d2; }
  .v4    { background: #ecdcb8; }
  .v8    { background: #f2b179; }
  .v16   { background: #f59563; }
  .v32   { background: #f67c5f; }
  .v64   { background: #f65e3b; color: #fff5ec; }
  .v128  { background: #edcf72; font-size: 30px; }
  .v256  { background: #edcc61; font-size: 30px; }
  .v512  { background: #edc850; font-size: 30px; }
  .v1024 { background: #6ba8d8; color: #071018; font-size: 24px; }
  .v2048 { background: #4e8fd0; color: #f2f8ff; font-size: 24px; box-shadow: 0 0 26px rgba(78,143,208,.5); }
  .vbig  { background: #3c3f8f; color: #eef0ff; font-size: 22px; }

  /* -------------------------------------------------------------- overlay */

  #overlay {
    position: absolute; inset: 10px; border-radius: 8px;
    background: rgba(8,10,16,.85); backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; padding: 20px; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #overlay h2 { margin: 0; font-size: 28px; letter-spacing: .08em; }
  #overlay .sub { color: var(--muted); font-size: 13px; line-height: 1.5; }
  #overlay .hint { margin-top: 10px; color: var(--accent); font-size: 13px; font-weight: 600; }

  /* ---------------------------------------------------------------- panel */

  .panel { width: 172px; display: flex; flex-direction: column; gap: 12px; }

  .title {
    font-size: 26px; font-weight: 700; letter-spacing: .18em; margin: 2px 0 4px;
    background: linear-gradient(180deg, #fff, #c8a86a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  .label { font-size: 10px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
  .value {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 24px; font-variant-numeric: tabular-nums; margin-top: 2px;
  }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn {
    width: 100%; padding: 9px 0; margin-top: 8px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-family: inherit;
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
    transition: border-color .16s, color .16s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .keys {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 10px;
    font-size: 12px; color: var(--muted); margin-top: 8px;
  }
  .keys b {
    color: var(--text); font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 2px 7px; font-size: 11px; text-align: center; white-space: nowrap;
  }

  .scores { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .score-row {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 8px;
    align-items: baseline; font-size: 12px; color: var(--muted);
  }
  .score-rank { color: #5a6478; font-size: 10px; }
  .score-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score-val {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; color: var(--text);
  }
  .score-row.new .score-name, .score-row.new .score-val { color: var(--accent); }
  .score-row.won .score-rank::after { content: '★'; margin-left: 2px; color: #f0d000; }
  .score-empty { margin-top: 8px; font-size: 12px; color: #5a6478; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .mode {
    padding: 7px 0; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 7px;
    color: var(--muted); font-family: inherit;
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
    transition: border-color .16s, color .16s;
  }
  .mode:hover { color: var(--text); }
  .mode.on { border-color: var(--accent); color: var(--accent); }
  .mode-note { margin-top: 8px; font-size: 11px; line-height: 1.45; color: #5a6478; }

  .backlink {
    position: fixed; top: 16px; left: 18px; z-index: 20;
    color: var(--muted); text-decoration: none;
    font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase;
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 7px;
    background: rgba(20,24,34,.6);
    transition: color .16s, border-color .16s;
  }
  .backlink:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 660px) {
    .game { flex-direction: column; align-items: center; }
    .panel { width: 320px; }
    .title { text-align: center; }
    #board { width: 300px; height: 300px; }
    .cell, .tile { width: 68px; height: 68px; font-size: 26px; }
    .backlink { top: 10px; left: 10px; padding: 6px 9px; font-size: 9.5px; }
  }
</style>
</head>
<body>

<a class="backlink" href="index.html">← Library</a>

<div class="game">
  <div class="board-wrap">
    <div id="board"></div>
    <div id="overlay">
      <h2 id="ov-title">Game Over</h2>
      <div class="sub" id="ov-sub"></div>
      <div class="hint" id="ov-hint">Press Enter to restart</div>
    </div>
  </div>

  <div class="panel">
    <div class="title">2048</div>

    <div class="card">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>

    <div class="stats">
      <div class="card">
        <div class="label">Best</div>
        <div class="value" id="best">0</div>
      </div>
      <div class="card">
        <div class="label">Top tile</div>
        <div class="value" id="toptile">0</div>
      </div>
    </div>

    <div class="card">
      <div class="label">Mode</div>
      <div class="modes">
        <button class="mode on" id="modefree" type="button">Free play</button>
        <button class="mode" id="modedaily" type="button">Daily</button>
      </div>
      <div class="mode-note" id="modenote"></div>
    </div>

    <div class="card">
      <div class="label" id="boardlabel">Leaderboard</div>
      <div class="scores" id="scores"></div>
    </div>

    <div class="card">
      <div class="label">Controls</div>
      <div class="keys">
        <b>← ↑ → ↓</b><span>Slide</span>
        <b>WASD</b><span>Slide</span>
        <b>Enter</b><span>Restart</span>
      </div>
      <button class="btn" id="restart">New game</button>
    </div>
  </div>
</div>

<script src="nova.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- config

  const SIZE = 4;
  const WIN_VALUE = 2048;
  const GAP = 12;                        // px between cells, matches the CSS
  const BEST_KEY = 'arcade.2048.best';
  const GAME_ID = '2048';
  const KEEP_SCORES = 10;

  const boardEl = document.getElementById('board');
  const el = {
    score: document.getElementById('score'),
    best: document.getElementById('best'),
    top: document.getElementById('toptile'),
    scores: document.getElementById('scores'),
    boardLabel: document.getElementById('boardlabel'),
    modeFree: document.getElementById('modefree'),
    modeDaily: document.getElementById('modedaily'),
    modeNote: document.getElementById('modenote'),
    overlay: document.getElementById('overlay'),
    ovTitle: document.getElementById('ov-title'),
    ovSub: document.getElementById('ov-sub'),
    ovHint: document.getElementById('ov-hint')
  };

  // Cell geometry is read off the rendered board rather than hardcoded, so
  // the mobile breakpoint (smaller board, smaller tiles) needs no JS branch.
  function cellSize() {
    return (boardEl.clientWidth - GAP * (SIZE - 1)) / SIZE;
  }

  let grid;                              // SIZE x SIZE of tile objects or null
  let score, best, won, state;           // state: 'playing' | 'won' | 'over'
  let nextId = 1;

  // 'free' spawns tiles from Math.random; 'daily' spawns them from a generator
  // seeded on the date, so every player draws the same tiles in the same order
  // that day. Unlike Tetris, this does not mean identical boards — the grid
  // diverges the moment two players slide differently — so the wording in the
  // UI promises the tile sequence and nothing more.
  let mode = 'free';
  let rand = Math.random;

  // ------------------------------------------------------------------ grid

  function emptyGrid() {
    const g = [];
    for (let r = 0; r < SIZE; r++) g.push(new Array(SIZE).fill(null));
    return g;
  }

  function forEachCell(fn) {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) fn(r, c);
  }

  function emptyCells() {
    const out = [];
    forEachCell(function (r, c) { if (!grid[r][c]) out.push({ r: r, c: c }); });
    return out;
  }

  function addRandomTile() {
    const spots = emptyCells();
    if (!spots.length) return null;
    const spot = spots[Math.floor(rand() * spots.length)];
    // The standard 90/10 split. A board of nothing but 2s is a slower, duller
    // game; the occasional 4 is what creates awkward parity to work around.
    const tile = {
      id: nextId++, value: rand() < 0.9 ? 2 : 4,
      r: spot.r, c: spot.c, spawn: true, merged: false
    };
    grid[spot.r][spot.c] = tile;
    return tile;
  }

  function topTile() {
    let top = 0;
    forEachCell(function (r, c) { if (grid[r][c] && grid[r][c].value > top) top = grid[r][c].value; });
    return top;
  }

  // ----------------------------------------------------------------- moves
  // One direction is implemented — sliding a line toward index 0 — and the
  // four directions are expressed as different ways of reading lines out of
  // the grid. Four hand-written copies of merge logic is where the bugs live.

  function lineFor(dir, i) {
    const line = [];
    for (let j = 0; j < SIZE; j++) {
      if (dir === 'left')  line.push({ r: i, c: j });
      if (dir === 'right') line.push({ r: i, c: SIZE - 1 - j });
      if (dir === 'up')    line.push({ r: j, c: i });
      if (dir === 'down')  line.push({ r: SIZE - 1 - j, c: i });
    }
    return line;
  }

  function move(dir) {
    let moved = false, gained = 0;

    forEachCell(function (r, c) { if (grid[r][c]) { grid[r][c].merged = false; grid[r][c].spawn = false; } });

    for (let i = 0; i < SIZE; i++) {
      const coords = lineFor(dir, i);
      const tiles = [];
      coords.forEach(function (p) { if (grid[p.r][p.c]) tiles.push(grid[p.r][p.c]); });
      coords.forEach(function (p) { grid[p.r][p.c] = null; });

      const out = [];
      for (let k = 0; k < tiles.length; k++) {
        const prev = out[out.length - 1];
        // One merge per tile per move: a freshly merged tile is inert for the
        // rest of this slide, so 2-2-4 becomes 4-4 and not 8.
        if (prev && prev.value === tiles[k].value && !prev.merged) {
          prev.value *= 2;
          prev.merged = true;
          gained += prev.value;
          moved = true;
        } else {
          out.push(tiles[k]);
        }
      }

      out.forEach(function (tile, k) {
        const p = coords[k];
        if (tile.r !== p.r || tile.c !== p.c) moved = true;
        tile.r = p.r;
        tile.c = p.c;
        grid[p.r][p.c] = tile;
      });
    }

    if (moved) score += gained;
    return moved;
  }

  function canMove() {
    if (emptyCells().length) return true;
    let can = false;
    forEachCell(function (r, c) {
      const v = grid[r][c].value;
      if (r + 1 < SIZE && grid[r + 1][c].value === v) can = true;
      if (c + 1 < SIZE && grid[r][c + 1].value === v) can = true;
    });
    return can;
  }

  // ---------------------------------------------------------------- render

  const nodes = {};                      // tile id -> DOM node

  function buildCells() {
    boardEl.innerHTML = '';
    const s = cellSize();
    forEachCell(function (r, c) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.width = s + 'px';
      cell.style.height = s + 'px';
      cell.style.transform = 'translate(' + (c * (s + GAP)) + 'px,' + (r * (s + GAP)) + 'px)';
      boardEl.appendChild(cell);
    });
  }

  function valueClass(v) {
    return v > 2048 ? 'vbig' : 'v' + v;
  }

  function render() {
    const s = cellSize();
    const seen = {};

    forEachCell(function (r, c) {
      const tile = grid[r][c];
      if (!tile) return;
      seen[tile.id] = true;

      let node = nodes[tile.id];
      if (!node) {
        node = document.createElement('div');
        boardEl.appendChild(node);
        nodes[tile.id] = node;
      }
      node.className = 'tile ' + valueClass(tile.value) +
                       (tile.spawn ? ' spawn' : '') + (tile.merged ? ' merged' : '');
      node.style.width = s + 'px';
      node.style.height = s + 'px';
      node.textContent = tile.value;
      node.style.transform = 'translate(' + (tile.c * (s + GAP)) + 'px,' + (tile.r * (s + GAP)) + 'px)';
    });

    // Tiles that were absorbed this move: their node is dropped once the
    // survivor has finished sliding over the top of them.
    Object.keys(nodes).forEach(function (id) {
      if (seen[id]) return;
      const node = nodes[id];
      delete nodes[id];
      window.setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 120);
    });

    el.score.textContent = score;
    el.best.textContent = best;
    el.top.textContent = topTile();
  }

  // ----------------------------------------------------------- leaderboard
  // The board is global. Nova posts to the shared server table and reads the
  // top rows back; it also always records the run locally, so a dropped
  // connection never loses one and a signed-out player still gets a board.
  // The panel label says which of the two you are looking at rather than
  // quietly showing a device board that looks worldwide.

  var boardIsGlobal = false;

  function playerName() {
    var u = window.Nova && window.Nova.user();
    return u ? u.username : 'Guest';
  }

  function refreshBoard(highlight) {
    const daily = mode === 'daily';
    return window.Nova.topScores(GAME_ID, 10, daily).then(function (res) {
      boardIsGlobal = res.global;
      // A daily board that could not be reached says so rather than falling
      // back to this device's scores: the daily is the shared race or it is
      // nothing, and local runs under a "Daily" heading would be a lie.
      el.boardLabel.textContent = daily
        ? (res.global ? 'Daily · World' : 'Daily · Offline')
        : (res.global ? 'Leaderboard · World' : 'Leaderboard · This device');
      renderScores(res.rows, highlight);
      return res;
    });
  }

  // ------------------------------------------------------------------ mode

  function resetsIn() {
    const ms = window.Nova.daily.msUntilReset();
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
  }

  function updateModeNote() {
    if (mode === 'free') {
      el.modeNote.textContent = 'Random tiles. Play as many games as you like.';
      return;
    }
    const rec = window.Nova.daily.record(GAME_ID);
    const parts = ['The same tiles, in the same order, for everyone today.'];
    if (!window.Nova.user()) parts.push('Sign in to be ranked.');
    else if (rec && !rec.pending) parts.push('Already played — this game will not be ranked.');
    else parts.push('One ranked game.');
    parts.push('Resets in ' + resetsIn() + '.');
    el.modeNote.textContent = parts.join(' ');
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    el.modeFree.classList.toggle('on', mode === 'free');
    el.modeDaily.classList.toggle('on', mode === 'daily');
    updateModeNote();
    reset();
    refreshBoard();
  }

  el.modeFree.addEventListener('click', function () { setMode('free'); });
  el.modeDaily.addEventListener('click', function () { setMode('daily'); });

  // Keeps the countdown honest without a per-frame cost, and rolls the note
  // over to the new day's wording on its own if the tab is left open.
  setInterval(function () { if (mode === 'daily') updateModeNote(); }, 30000);

  // Returns the 1-based place this run took on the board it landed on, or
  // null if it missed. Matching on name+score is enough here: the only way to
  // collide is the same player posting the identical score twice, which lands
  // on the same rank anyway.
  function postRun(meta) {
    if (score <= 0) return Promise.resolve({ place: null, reason: null });
    var mine = { name: playerName(), score: score };
    var reason = null;
    return window.Nova.submitScore(GAME_ID, score, meta, mode === 'daily')
      .then(function (res) {
        reason = res.posted ? null : res.reason;
        updateModeNote();               // a ranked daily game is now spent
        return refreshBoard(mine);
      })
      .then(function (res) {
        for (var i = 0; i < res.rows.length; i++) {
          if (res.rows[i].score === mine.score && res.rows[i].name === mine.name) {
            return { place: i + 1, reason: reason };
          }
        }
        return { place: null, reason: reason };
      })
      .catch(function () { return { place: null, reason: reason }; });
  }

  // Why a game did not make the board, when that is worth saying out loud. A
  // missed placing is ordinary and needs no explanation; being unranked
  // because you are signed out, or because today's attempt is already spent,
  // is not obvious from the board alone.
  function reasonText(reason) {
    if (reason === 'guest') return '<br>Sign in to be ranked.';
    if (reason === 'already-played') return '<br>Today\'s daily game is already on the board.';
    return '';
  }

  function renderScores(rows, highlight) {
    var host = el.scores;
    host.innerHTML = '';

    if (!rows || !rows.length) {
      var empty = document.createElement('div');
      empty.className = 'score-empty';
      empty.textContent = 'No runs yet';
      host.appendChild(empty);
      return;
    }

    rows.slice(0, 5).forEach(function (entry, i) {
      var mine = highlight && entry.name === highlight.name && entry.score === highlight.score;
      var row = document.createElement('div');
      row.className = 'score-row' + (mine ? ' new' : '') + (entry.won ? ' won' : '');

      var rank = document.createElement('span');
      rank.className = 'score-rank';
      rank.textContent = (i + 1);

      var name = document.createElement('span');
      name.className = 'score-name';
      name.textContent = entry.name;

      var val = document.createElement('span');
      val.className = 'score-val';
      val.textContent = entry.score;

      row.appendChild(rank);
      row.appendChild(name);
      row.appendChild(val);
      host.appendChild(row);
    });
  }

  function placeText(place) {
    if (!place) return '';
    var where = boardIsGlobal ? 'in the world' : 'on this device';
    return '<br>' + (place === 1 ? 'Number 1 ' + where + '!' : 'Number ' + place + ' ' + where);
  }

  // ------------------------------------------------------------ end states

  function showOverlay(title, sub, hint) {
    el.ovTitle.textContent = title;
    el.ovSub.innerHTML = sub;
    el.ovHint.textContent = hint;
    el.overlay.classList.add('show');
  }

  function hideOverlay() { el.overlay.classList.remove('show'); }

  // The overlay goes up immediately with what is already known, and the
  // placing is filled in when the board answers — a run should never wait on
  // the network to tell you it ended.
  function endRun(didWin, title, base, hint) {
    showOverlay(title, base, hint);
    const at = state;
    postRun({ won: didWin, top: topTile() }).then(function (out) {
      if (state !== at) return;
      const extra = placeText(out.place) + reasonText(out.reason);
      if (extra) el.ovSub.innerHTML = base + extra;
    });
  }

  function win() {
    state = 'won';
    endRun(true, '2048', 'You made the tile.<br>Score <b>' + score + '</b>',
           'Press Enter to keep going');
  }

  function gameOver() {
    state = 'over';
    endRun(won, 'Game Over',
           'No moves left.<br>Score <b>' + score + '</b> &nbsp;·&nbsp; Top tile ' + topTile(),
           'Press Enter to restart');
  }

  // Carrying on after 2048 keeps the same board and score — the win is a
  // milestone, and the real game for most people starts after it.
  function keepGoing() {
    state = 'playing';
    hideOverlay();
  }

  // ------------------------------------------------------------------ turn

  function loadBest() {
    try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; }
    catch (e) { return 0; }
  }

  function saveBest() {
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* ignore */ }
  }

  function turn(dir) {
    if (state !== 'playing') return;
    if (!move(dir)) return;

    addRandomTile();
    if (score > best) { best = score; saveBest(); }
    render();

    if (!won && topTile() >= WIN_VALUE) { won = true; win(); return; }
    if (!canMove()) gameOver();
  }

  function reset() {
    // Re-seeded on every reset rather than once at boot, so restarting the
    // daily deals that day's tiles again from the top.
    rand = (mode === 'daily' && window.Nova && window.Nova.daily)
      ? window.Nova.daily.rng(GAME_ID)
      : Math.random;
    grid = emptyGrid();
    Object.keys(nodes).forEach(function (id) { delete nodes[id]; });
    score = 0;
    won = false;
    state = 'playing';
    buildCells();
    addRandomTile();
    addRandomTile();
    hideOverlay();
    render();
  }

  // ----------------------------------------------------------------- input

  const KEYS = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };

  window.addEventListener('keydown', function (e) {
    const dir = KEYS[e.key];
    if (dir) e.preventDefault();

    if (state === 'over') {
      if (e.key === 'Enter' || e.key === ' ') reset();
      return;
    }
    if (state === 'won') {
      if (e.key === 'Enter' || e.key === ' ') keepGoing();
      return;
    }
    if (e.key === 'Enter') { reset(); return; }
    if (dir) turn(dir);
  });

  el.overlay.addEventListener('click', function () {
    if (state === 'won') keepGoing();
    else if (state === 'over') reset();
  });

  document.getElementById('restart').addEventListener('click', reset);

  // Swipe, so the mobile layout is actually playable.
  let touchX = 0, touchY = 0;
  window.addEventListener('touchstart', function (e) {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', function (e) {
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (state === 'over') { reset(); return; }
    if (state === 'won') { keepGoing(); return; }
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });

  window.addEventListener('resize', function () {
    buildCells();
    render();
  });

  // ------------------------------------------------------------------ boot

  // Opened from the library, this page has its own tab or window with the
  // library still sitting behind it, so "back to the library" means closing
  // this one — navigating would stack a second hub on top of the first.
  // window.opener is the test rather than a desktop check, because it is
  // equally true of a browser tab and an Electron window, and it is false
  // when the page was opened directly from a bookmark or a shared link,
  // where there is nothing to close and the link should behave normally.
  const backlink = document.querySelector('.backlink');
  if (backlink && window.opener) {
    backlink.addEventListener('click', function (e) {
      e.preventDefault();
      window.close();
    });
  }

  best = loadBest();
  reset();
  updateModeNote();
  refreshBoard();                        // fills the panel before the first run ends

  // Opened as its own tab/window, this page starts with no session of its
  // own — Nova.user() is null until the stored one is read back in, which is
  // what left every run here posting as a guest even when signed in on the
  // launcher. Non-blocking: the panel already painted as guest above, and
  // corrects itself the moment this resolves.
  if (window.Nova) {
    window.Nova.restore().then(function () {
      updateModeNote();
      refreshBoard();
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
